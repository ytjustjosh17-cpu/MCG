name: Android APK

on:
  push:
    branches:
      - claude/mobile-game-samsung-s23-jipcyi
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      GODOT_VERSION: 4.4.1
      # Optional repo secrets for a fixed release key. Without them the build
      # is signed with the CI image's debug key instead.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the image's Godot templates and Android settings
        run: |
          mkdir -p ~/.local/share/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/ || true
          cp -r /root/.config/godot/. ~/.config/godot/ || true
          ls ~/.local/share/godot/export_templates/
          ls ~/.config/godot/

      - name: Set signing key and version number
        working-directory: game
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            sed -i "s|keystore/release=\".*\"|keystore/release=\"/tmp/release.keystore\"|" export_presets.cfg
            sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"$KEYSTORE_ALIAS\"|" export_presets.cfg
            sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|" export_presets.cfg
            echo "EXPORT_MODE=--export-release" >> "$GITHUB_ENV"
          else
            echo "No release key secret set: signing with the debug key."
            echo "EXPORT_MODE=--export-debug" >> "$GITHUB_ENV"
          fi
          sed -i "s|^version/code=.*|version/code=$GITHUB_RUN_NUMBER|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"0.1.$GITHUB_RUN_NUMBER\"|" export_presets.cfg

      - name: Import project
        working-directory: game
        run: godot --headless --import || true

      - name: Smoke test
        working-directory: game
        run: godot --headless --path . -s res://tests/smoke_test.gd

      - name: Export APK
        working-directory: game
        run: |
          mkdir -p build
          godot --headless --verbose $EXPORT_MODE "Android" build/RedSunHoldings.apk
          ls -la build
          test -s build/RedSunHoldings.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RedSunHoldings-apk
          path: game/build/RedSunHoldings.apk
          if-no-files-found: error
