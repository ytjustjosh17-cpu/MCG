name: Android APK

on:
  push:
    branches:
      - claude/mobile-game-samsung-s23-jipcyi
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # for the build provenance stamp (attestation)
  attestations: write

jobs:
  rules:
    # Quick checks from CLAUDE.md; the build only runs if these pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project rules (see CLAUDE.md)
        run: python3 tools/check_rules.py

  android:
    needs: rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.4.1
    env:
      GODOT_VERSION: 4.4.1
      # Personal hobby app: the signing key is kept in the repo (owner's choice)
      # so every build installs over the last one and keeps the save.
      KEYSTORE_PASSWORD: redsunholdings
      KEYSTORE_ALIAS: redsun
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the image's Godot templates and Android settings
        run: |
          mkdir -p ~/.local/share/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/ || true
          cp -r /root/.config/godot/. ~/.config/godot/ || true

      - name: Set signing key and version number
        working-directory: game
        run: |
          sed -i "s|keystore/release=\".*\"|keystore/release=\"$GITHUB_WORKSPACE/game/android/release.keystore\"|" export_presets.cfg
          sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"$KEYSTORE_ALIAS\"|" export_presets.cfg
          sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=$BUILD_NUMBER|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.1.$BUILD_NUMBER\"|" export_presets.cfg
          sed -i "s|^config/version=.*|config/version=\"1.1.$BUILD_NUMBER\"|" project.godot
          grep -E "^config/version" project.godot

      - name: Get fonts from Fontshare (not stored in this public repo)
        working-directory: game
        shell: bash
        run: |
          # Switzer and Tanker use the ITF Free Font License, which allows
          # embedding in an app but not sharing the files in a public repo.
          # Build 25 shipped without them by accident, so this step now stops
          # the build if they are missing instead of quietly using Inter.
          mkdir -p assets/fonts/ext /tmp/fonts
          if ! command -v curl >/dev/null || ! command -v unzip >/dev/null; then
            apt-get update -qq && apt-get install -y -qq curl unzip
          fi
          for f in switzer tanker; do
            for i in 1 2 3 4; do
              curl -fSL --retry 2 -A "Mozilla/5.0" -o /tmp/fonts/$f.zip \
                "https://api.fontshare.com/v2/fonts/download/$f" && unzip -tq /tmp/fonts/$f.zip && break
              echo "Try $i for $f failed"; sleep $((i * 5))
            done
          done
          unzip -j -o -q /tmp/fonts/switzer.zip '*/WEB/fonts/Switzer-Regular.ttf' '*/WEB/fonts/Switzer-Semibold.ttf' -d assets/fonts/ext
          unzip -j -o -q /tmp/fonts/tanker.zip '*/WEB/fonts/Tanker-Regular.ttf' -d assets/fonts/ext
          ls -la assets/fonts/ext
          for n in Switzer-Regular Switzer-Semibold Tanker-Regular; do
            test -s assets/fonts/ext/$n.ttf || { echo "::error::Font $n is missing"; exit 1; }
            cp assets/fonts/ext/$n.ttf assets/fonts/ext/$n.bin   # raw copy, packed as-is
          done

      - name: Import project
        working-directory: game
        run: godot --headless --import || true

      - name: Smoke test
        working-directory: game
        run: godot --headless --path . -s res://tests/smoke_test.gd

      - name: Stress test
        working-directory: game
        run: godot --headless --path . -s res://tests/stress_test.gd

      - name: Market test (no easy trading edge)
        working-directory: game
        run: godot --headless --path . -s res://tests/market_test.gd -- 20

      - name: Casino test (the house always keeps a small edge)
        working-directory: game
        run: godot --headless --path . -s res://tests/casino_test.gd

      - name: Scroll test (as a touchscreen)
        working-directory: game
        run: |
          printf '[input_devices]\n\npointing/emulate_touch_from_mouse=true\n' > override.cfg
          godot --headless --path . -s res://tests/scroll_test.gd
          godot --headless --path . -s res://tests/tables_ui_test.gd
          printf '[application]\n\nconfig/use_custom_user_dir=true\nconfig/custom_user_dir_name="sol-slots-test"\n\n[input_devices]\n\npointing/emulate_touch_from_mouse=true\n' > override.cfg
          godot --headless --path . -s res://tests/slots_ui_test.gd
          rm override.cfg

      - name: Export APK
        working-directory: game
        run: |
          mkdir -p build
          godot --headless --verbose --export-release "Android" build/Sol.apk
          test -s build/Sol.apk
          ls -la build

      - name: Check the APK has the fonts
        working-directory: game
        shell: bash
        run: |
          command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip)
          unzip -l build/Sol.apk > /tmp/apk-files.txt
          grep -iE "switzer|tanker" /tmp/apk-files.txt || true
          for n in Switzer-Regular Switzer-Semibold Tanker-Regular; do
            grep -qE "$n\.(ttf|bin)" /tmp/apk-files.txt || { echo "::error::$n is not in the APK"; exit 1; }
          done
          echo "Fonts are in the APK"

      - name: Fingerprint (SHA-256)
        id: sum
        working-directory: game
        shell: bash
        run: |
          SUM=$(sha256sum build/Sol.apk | cut -d' ' -f1)
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "$SUM  Sol.apk" > build/Sol.apk.sha256
          echo "SHA-256: $SUM"

      - name: Stamp where the APK came from (build provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: game/build/Sol.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sol-apk
          path: game/build/Sol.apk
          if-no-files-found: error

      - name: Publish release
        id: publish
        continue-on-error: true  # GitHub sometimes errors here; the next step retries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Sol 1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            game/build/Sol.apk
            game/build/Sol.apk.sha256
          make_latest: "true"
          body: |
            Build ${{ github.run_number }}.
            Install: open this on your phone and tap Sol.apk.

            **Check this file is genuine**
            - Built by GitHub Actions from commit ${{ github.sha }} ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            - SHA-256: `${{ steps.sum.outputs.sha256 }}`
            - Proof it came from this repo: `gh attestation verify Sol.apk -R ${{ github.repository }}`
            - Virus scan: [VirusTotal](https://www.virustotal.com/gui/file/${{ steps.sum.outputs.sha256 }}) (if it says "not found", upload the file there to scan it).

      - name: Wait before retrying
        if: steps.publish.outcome == 'failure'
        run: sleep 60

      - name: Publish release (retry)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Sol 1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            game/build/Sol.apk
            game/build/Sol.apk.sha256
          make_latest: "true"
          body: |
            Build ${{ github.run_number }}.
            Install: open this on your phone and tap Sol.apk.

            **Check this file is genuine**
            - Built by GitHub Actions from commit ${{ github.sha }} ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            - SHA-256: `${{ steps.sum.outputs.sha256 }}`
            - Proof it came from this repo: `gh attestation verify Sol.apk -R ${{ github.repository }}`
            - Virus scan: [VirusTotal](https://www.virustotal.com/gui/file/${{ steps.sum.outputs.sha256 }}) (if it says "not found", upload the file there to scan it).
