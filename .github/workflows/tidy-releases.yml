name: Tidy releases

# Run by hand only (Actions > Tidy releases > Run workflow).
# Keeps only the newest release (the one the in-game Update button installs)
# and deletes every older release and its tag. The newest release carries
# notes for every version, grouped as 1.2, 1.1 and 1.0
# (.github/release-notes/), so nothing is lost from the page.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the newest release
        shell: bash
        run: |
          set -uo pipefail
          LATEST=$(gh release view --json tagName --jq .tagName)
          echo "Keeping: $LATEST"
          for t in $(gh release list --limit 500 --json tagName --jq '.[].tagName'); do
            [ "$t" = "$LATEST" ] && continue
            # Some very old releases have no tag left, so a failed tag delete is fine.
            gh release delete "$t" --cleanup-tag --yes || true
            gh release view "$t" >/dev/null 2>&1 && gh release delete "$t" --yes || true
          done
          # Older tags with no release at all.
          for t in $(git ls-remote --tags origin | sed 's|.*refs/tags/||; s|\^{}||' | sort -u); do
            [ "$t" = "$LATEST" ] || git push -q origin --delete "refs/tags/$t" || true
          done
          gh release view "$LATEST" --json body --jq .body > body.md
          if ! grep -q "^## Sol 1.0" body.md; then
            cat .github/release-notes/1.2.md .github/release-notes/1.1.md .github/release-notes/1.0.md > notes.md
            printf '\n---\n\n' >> notes.md
            cat body.md >> notes.md
            gh release edit "$LATEST" --notes-file notes.md
          fi
          gh release list --limit 20
